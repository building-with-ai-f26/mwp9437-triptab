# TripTab's checks and deploys (Build 3, Advanced lane).
#
# Every pull request and every push to main: lint, unit tests, type check and build, then the live
# database security tests against TripTab dev (the second Supabase project, never real users).
# A pull request then gets a Preview on Cloudflare, built against TripTab dev, with its link posted
# on the pull request; closing the pull request deletes it. A push to main deploys production to
# https://triptab.org, but only after the tests pass, then checks the live site serves the new build.
# To go back to an earlier version, run the "Roll back production" workflow (rollback.yml).
#
# The Supabase and PostHog values below are public by design: they ship in the browser, and
# row-level security in the database decides what anyone can do (see app/.env.example). The one
# secret is CLOUDFLARE_API_TOKEN, a GitHub repository secret that Mike enters himself.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  test:
    name: Tests
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://iivseqkvixmvcpldarqy.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_wXWIUwViR_2h7G1VsubAkA_eTKSWSgJ
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests (money math, data model, timeline, AI rules)
        run: npm test
      - name: Type check and build
        run: npm run build
      - name: Database security tests, against TripTab dev
        run: npm run test:rls

  preview:
    name: Preview
    needs: test
    # Forks never get the Cloudflare secret.
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      VITE_SUPABASE_URL: https://iivseqkvixmvcpldarqy.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_wXWIUwViR_2h7G1VsubAkA_eTKSWSgJ
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Check the Cloudflare token is set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::The CLOUDFLARE_API_TOKEN repository secret is missing. Mike adds it in GitHub: Settings, Secrets and variables, Actions."
            exit 1
          fi
      - name: Build against TripTab dev
        run: npm run build -- --mode preview
      - id: preview
        name: Create or update the Preview
        run: |
          set -o pipefail
          output="$(npx wrangler preview --name "$PREVIEW_NAME" --json)"
          printf '%s\n' "$output"
          url="$(printf '%s' "$output" | jq -er '.preview.urls[0]')"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Check the Preview serves this build
        env:
          URL: ${{ steps.preview.outputs.url }}
        run: |
          asset="$(grep -o 'assets/index-[^"]*\.js' dist/index.html | head -1)"
          for i in $(seq 1 12); do
            if curl -fsS "$URL/" | grep -qF "$asset" && [ "$(curl -s -o /dev/null -w '%{http_code}' "$URL/join/preview-check")" = "200" ]; then
              echo "Preview serves $asset, and app routes fall back to the app."; exit 0
            fi
            sleep 5
          done
          echo "::error::The Preview at $URL doesn't serve $asset yet."; exit 1
      - name: Post the Preview link on the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL: ${{ steps.preview.outputs.url }}
          NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr comment "$NUMBER" --edit-last --create-if-none --body "Preview of this pull request, on TripTab dev (test data, never real users): $URL

          Built from ${SHA::7}. It updates on every push and is deleted when the pull request closes."

  cleanup:
    name: Delete the Preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx wrangler preview delete --name "$PREVIEW_NAME" --skip-confirmation || echo "No Preview named $PREVIEW_NAME to delete."

  deploy:
    name: Deploy to triptab.org
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One production deploy at a time, in merge order.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VITE_SUPABASE_URL: https://pptzbogslzicfyjooqra.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_-_AJFvHpurCuAHnKjIEuvQ__xAzXCJ_
      VITE_POSTHOG_KEY: phc_pN7znkKDFxYdyXzvBva5VMxpxBRu5tVPhMo5V5DcwfbT
      VITE_POSTHOG_HOST: https://us.i.posthog.com
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Check the Cloudflare token is set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::The CLOUDFLARE_API_TOKEN repository secret is missing. Mike adds it in GitHub: Settings, Secrets and variables, Actions."
            exit 1
          fi
      - name: Build for production
        run: npm run build
      - name: Deploy
        run: npx wrangler deploy --message "main ${GITHUB_SHA::7}"
      - name: Check triptab.org serves this build
        run: |
          asset="$(grep -o 'assets/index-[^"]*\.js' dist/index.html | head -1)"
          for i in $(seq 1 24); do
            if curl -fsS https://triptab.org/ | grep -qF "$asset" && [ "$(curl -s -o /dev/null -w '%{http_code}' https://triptab.org/join/deploy-check)" = "200" ]; then
              echo "triptab.org serves $asset, and app routes fall back to the app."; exit 0
            fi
            sleep 5
          done
          echo "::error::triptab.org doesn't serve $asset two minutes after the deploy."; exit 1
