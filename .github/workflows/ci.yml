# TripTab's check on every pull request and every push to main: the same script Cloudflare runs
# before it deploys (app/scripts/cloudflare-build.sh): lint, unit tests, type check, the live
# database security tests against TripTab dev, then a Preview build against dev.
#
# Deploys don't happen here. Cloudflare's Workers Builds deploys main to https://triptab.org and
# gives each pull request a Preview, running this same script first, so a failing test means no
# deploy. Rollback is in Cloudflare: the triptab Worker, Deployments, Rollback (AGENTS.md, Shipping).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: Lint, unit tests, type check, database tests against TripTab dev, Preview build
        run: bash app/scripts/cloudflare-build.sh
