# Roll triptab.org back to an earlier version, from GitHub: Actions, "Roll back production",
# Run workflow. Leave the version blank to go back one deploy. This only changes which build of
# the app is served; the database is untouched. The next merge to main deploys forward again.
name: Roll back production

on:
  workflow_dispatch:
    inputs:
      version_id:
        description: "Version ID to go back to (blank: the one before the current one). Listed by the first step of an earlier run."
        required: false
        default: ""
      reason:
        description: "Why (kept on the deployment in Cloudflare)"
        required: true
        default: "Rolled back from GitHub Actions"

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  rollback:
    name: Roll back triptab.org
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VERSION_ID: ${{ inputs.version_id }}
      REASON: ${{ inputs.reason }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Recent deployments, before
        run: npx wrangler deployments list
      - name: Roll back
        run: |
          if [ -n "$VERSION_ID" ] && ! printf '%s' "$VERSION_ID" | grep -Eq '^[0-9a-f-]{36}$'; then
            echo "::error::That doesn't look like a version ID."; exit 1
          fi
          npx wrangler rollback ${VERSION_ID:+"$VERSION_ID"} --message "$REASON"
      - name: Recent deployments, after
        run: npx wrangler deployments list
      - name: Check triptab.org still answers
        run: |
          for i in $(seq 1 24); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' https://triptab.org/)" = "200" ]; then echo "triptab.org answers."; exit 0; fi
            sleep 5
          done
          echo "::error::triptab.org isn't answering after the rollback."; exit 1
