<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>TripTab has moved to triptab.org</title>
    <link rel="canonical" href="https://triptab.org/" />
    <script>
      // TripTab moved here from GitHub Pages on 11/18 (Build 3). Links shared before then put the
      // screen after a # (.../app/#/join/abc); triptab.org uses plain paths (/join/abc). Keep the
      // rest of the link, so a group link or a trip link opens the same screen on the new address.
      //
      // Sign-ins made here before the move left their tokens in this address's storage, which every
      // other project page on this GitHub account can read (security audit, 11/22). They go first.
      (function () {
        try {
          Object.keys(localStorage).forEach(function (k) {
            if (/^sb-.*-auth-token/.test(k)) localStorage.removeItem(k);
          });
        } catch (e) {}
        var rest = location.hash.replace(/^#/, "");
        if (rest.charAt(0) !== "/") rest = "/";
        location.replace("https://triptab.org" + rest);
      })();
    </script>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4ede3; color: #2b2118;
             font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
      a { color: #6b4a2b; font-weight: 600; }
    </style>
  </head>
  <body>
    <p>TripTab has moved to <a id="to" href="https://triptab.org/">triptab.org</a>. Taking you there now.</p>
    <script>
      var rest = location.hash.replace(/^#/, "");
      if (rest.charAt(0) === "/") document.getElementById("to").href = "https://triptab.org" + rest;
    </script>
  </body>
</html>
